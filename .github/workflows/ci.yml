name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install (only if a lockfile exists)
        run: |
          if [ -f package-lock.json ]; then npm ci; else echo "No package-lock.json; no dependencies to install."; fi
      - name: Syntax check JS
        run: |
          set -e
          files=$(find public/js netlify/functions -type f \( -name '*.js' -o -name '*.mjs' \))
          for f in $files; do echo "node --check $f"; node --check "$f"; done
      - name: Tests
        run: npm test
